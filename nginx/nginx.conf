server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 32m;

    # API de Kokoro (compatible con OpenAI). El prefijo /api/ se elimina:
    #   /api/v1/audio/speech  ->  http://kokoro:8880/v1/audio/speech
    location /api/ {
        proxy_pass http://kokoro:8880/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Textos largos: la síntesis puede tardar minutos en CPU.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 30s;

        # Audio en streaming, sin buffer intermedio.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
